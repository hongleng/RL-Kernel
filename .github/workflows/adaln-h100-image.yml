name: Build indexed AdaLN acceptance image

on:
  workflow_dispatch:
    inputs:
      infrastructure_ref:
        description: Image preparation branch or commit
        required: true
        default: infra/adaln-indexed-image

permissions:
  contents: read
  packages: write

concurrency:
  group: adaln-indexed-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.infrastructure_ref }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Prepare fixed source and runners
        run: |
          SOURCE_SHA=$(python3 -c 'import json; print(json.load(open("docker/adaln-indexed/source.json"))["source_sha"])')
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          python3 docker/adaln-indexed/prepare_context.py --out "$RUNNER_TEMP/adaln-context"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/adaln-indexed" >> "$GITHUB_ENV"
          echo "INFRA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check context syntax and CPU-only recovery entry
        run: |
          python3 -m py_compile "$RUNNER_TEMP/adaln-context/.cache/adaln-indexed/"*.py
          python3 "$RUNNER_TEMP/adaln-context/.cache/adaln-indexed/evidence_io.py" --help
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image; no GPU execution
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/adaln-context
          file: ${{ runner.temp }}/adaln-context/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.INFRA_SHA }}
          tags: ${{ env.IMAGE }}:source-${{ env.SOURCE_SHA }}-${{ env.INFRA_SHA }}
          cache-from: type=gha,scope=adaln-indexed
          cache-to: type=gha,mode=max,scope=adaln-indexed
      - name: Export CPU and collection evidence from the cached image build
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/adaln-context
          file: ${{ runner.temp }}/adaln-context/Dockerfile
          target: evidence
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/indexed-image-evidence
      - name: Save image identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          cp -a "$RUNNER_TEMP/indexed-image-evidence" image-evidence
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" | tee image-evidence/image-reference.txt
          printf '%s\n' "$BUILD_METADATA" > image-evidence/build-metadata.json
          printf 'Source: %s\nInfrastructure: %s\nWorkflow: %s\n' "$SOURCE_SHA" "$INFRA_SHA" "$GITHUB_SHA" > image-evidence/commits.txt
          cat image-evidence/image-reference.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: adaln-indexed-image-evidence
          path: image-evidence/
          if-no-files-found: error
