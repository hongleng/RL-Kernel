name: Build AdaLN H100 acceptance image

on:
  workflow_dispatch:
    inputs:
      infrastructure_ref:
        description: Image preparation branch or commit
        required: true
        default: infra/adaln-h100-image

permissions:
  contents: read
  packages: write

concurrency:
  group: adaln-h100-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.infrastructure_ref }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Prepare fixed source and runners
        run: |
          SOURCE_SHA=69bd47f72a24d1177580d9b11b6efdfeb6c6bab5
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          python3 docker/adaln-h100/prepare_context.py --out "$RUNNER_TEMP/adaln-context"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/adaln-h100" >> "$GITHUB_ENV"
          echo "INFRA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image; no GPU execution
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/adaln-context
          file: ${{ runner.temp }}/adaln-context/Dockerfile
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.INFRA_SHA }}
          tags: ${{ env.IMAGE }}:source-69bd47f-${{ env.INFRA_SHA }}
          cache-from: type=gha,scope=adaln-h100
          cache-to: type=gha,mode=max,scope=adaln-h100
      - name: Save image identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          mkdir -p image-evidence
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" | tee image-evidence/image-reference.txt
          printf '%s\n' "$BUILD_METADATA" > image-evidence/build-metadata.json
          cp "$RUNNER_TEMP/adaln-context/acceptance/source-profile.json" image-evidence/
          cp docker/adaln-h100/{Dockerfile,requirements.txt} docker/adaln-h100/acceptance/{environment,test-manifest}.json image-evidence/
          printf 'Source: 69bd47f72a24d1177580d9b11b6efdfeb6c6bab5\nInfrastructure: %s\nWorkflow: %s\n' "$INFRA_SHA" "$GITHUB_SHA" > image-evidence/commits.txt
          cat image-evidence/image-reference.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: adaln-h100-image-evidence
          path: image-evidence/
          if-no-files-found: error
