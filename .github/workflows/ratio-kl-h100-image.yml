name: Build ratio_kl H100 image

on:
  push:
    branches: [ infra/ratio-kl-h100-image ]
    paths:
      - '.github/workflows/ratio-kl-h100-image.yml'
      - 'docker/ratio-kl-h100/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ratio-kl-h100/Dockerfile
          push: true
          tags: ghcr.io/hongleng/rl-kernel-ratio-kl:fd6fde5-density-runtime
